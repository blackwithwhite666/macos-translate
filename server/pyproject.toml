[project]
name = "macos-translate-server"
version = "0.1.0"
description = "Локальный сервер перевода: TranslateGemma (MLX) в подпроцессе + lingua + WebSocket для UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    # 0.31.3 — твёрдый минимум (см. translategemma-studio)
    "mlx-lm>=0.31.3",
    "lingua-language-detector>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16",
    "ty>=0.0.69",
]

[tool.ruff]
line-length = 100
